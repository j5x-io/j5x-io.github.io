<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/dx-logo.png">
    <link rel="apple-touch-icon" href="./assets/dx-logo.png">
    <script src="./storage-consent.js"></script>
    <title>大熊寶殿 - 晉級賽程圖表工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        :root {
            /* 預設主題：黑粉色系 */
            --theme-color: #ff9ef7; /* 預設粉色 */
            --theme-rgb: 255, 158, 247;
            --canvas-bg: #050000;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: var(--canvas-bg); 
            color: #fff; 
            overflow: hidden; 
            transition: background-color 0.3s ease;
        }

        /* 捲動條美化 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(var(--theme-rgb), 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-color); }
        
        select option { background: #171717; color: white; }

        /* 動態主題 CSS 類別 */
        .text-theme { color: var(--theme-color); }
        .bg-theme { background-color: var(--theme-color); }
        .bg-theme-dark { background-color: rgba(var(--theme-rgb), 0.2); }
        .border-theme { border-color: rgba(var(--theme-rgb), 0.5); }
        .border-theme-strong { border-color: var(--theme-color); }
        .hover-bg-theme:hover { background-color: var(--theme-color); color: white; }
        .hover-bg-theme-light:hover { background-color: rgba(var(--theme-rgb), 0.3); }
        .shadow-theme { box-shadow: 0 0 15px rgba(var(--theme-rgb), 0.5); }
        .shadow-theme-glow { box-shadow: 0 0 25px rgba(var(--theme-rgb), 0.8); }
        .shadow-inner-theme { box-shadow: inset 0 0 15px rgba(var(--theme-rgb), 0.4); }
        .drop-shadow-theme { filter: drop-shadow(0 0 10px rgba(var(--theme-rgb), 0.5)); }

        /* 截圖模式隱藏移除按鈕 */
        body.screenshot-mode .remove-btn { display: none !important; }
        
        /* 替補人員紫光特效 */
        .injected-player {
            color: #c084fc !important; /* purple-400 */
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.8);
            font-weight: 900;
        }
    </style>
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./tool-theme.css">
</head>
<body class="h-screen w-screen flex flex-col">

    <nav class="j5-toolbar" aria-label="工具導覽">
        <a class="j5-tool-brand" href="./index.html">
            <img class="j5-tool-logo" src="./assets/dx-logo.png" alt="">
            <span>大熊寶殿 GTARP 工具庫</span>
        </a>
        <a class="j5-tool-back" href="./index.html" aria-label="返回工具庫"><span aria-hidden="true">←</span><span>返回工具庫</span></a>
    </nav>

    <div class="j5-tool-shell flex flex-col md:flex-row overflow-auto md:overflow-hidden">

    <aside class="w-full md:w-80 bg-neutral-950 border-b md:border-b-0 md:border-r border-theme flex flex-col z-20 shrink-0 shadow-[4px_0_20px_rgba(0,0,0,0.8)] h-auto md:h-full overflow-y-auto">
        <div class="p-6 flex-grow flex flex-col">
            <div class="mb-6">
                <h1 class="text-3xl font-black text-theme tracking-widest drop-shadow-theme mb-1">大熊寶殿</h1>
                <h2 class="text-sm text-gray-400 font-bold tracking-widest">晉級賽程圖表工具</h2>
            </div>
            
            <div class="space-y-4 flex-grow">
                <!-- 賽事模式 -->
                <div>
                    <label class="text-xs text-theme font-bold mb-1 block tracking-widest">賽事模式</label>
                    <select id="modeSelect" onchange="handleModeChange()" class="w-full bg-black border border-theme rounded p-2 text-white focus:outline-none focus:border-theme-strong transition-colors text-sm">
                        <option value="random">隨機抽籤 (自動配對)</option>
                        <option value="manual">手動配對 (選手A vs 選手B)</option>
                    </select>
                </div>

                <!-- 決賽模式 -->
                <div>
                    <label class="text-xs text-theme font-bold mb-1 block tracking-widest">決賽模式</label>
                    <select id="ffaSelect" class="w-full bg-black border border-theme rounded p-2 text-white focus:outline-none focus:border-theme-strong transition-colors text-sm">
                        <option value="false">標準對決 (一路 1v1 到底)</option>
                        <option value="true">大混戰 (最後 3~4 人同台對決)</option>
                    </select>
                </div>

                <div class="border-t border-neutral-800 my-2"></div>

                <!-- 主題顏色設定 -->
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-xs text-theme font-bold mb-1 block tracking-widest">主色調</label>
                        <div class="flex items-center gap-2">
                            <input type="color" id="themeColorPicker" value="#ec4899" onchange="updateThemeColors()" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0 p-0">
                            <span class="text-xs text-gray-400">系統顏色</span>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs text-theme font-bold mb-1 block tracking-widest">背景色</label>
                        <div class="flex items-center gap-2">
                            <input type="color" id="bgColorPicker" value="#050000" onchange="updateThemeColors()" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0 p-0">
                            <span class="text-xs text-gray-400">畫布背景</span>
                        </div>
                    </div>
                </div>

                <!-- 截圖模式開關 -->
                <div>
                    <label class="flex items-center gap-2 cursor-pointer group mt-2">
                        <input type="checkbox" id="screenshotToggle" onchange="toggleScreenshotMode()" class="w-4 h-4 accent-[var(--theme-color)] cursor-pointer">
                        <span class="text-xs text-gray-300 font-bold tracking-wider group-hover:text-white transition-colors">隱藏替補移除按鈕 (截圖模式)</span>
                    </label>
                </div>

                <div class="border-t border-neutral-800 my-2"></div>

                <!-- 文字自訂設定 -->
                <div>
                    <label class="text-xs text-theme font-bold mb-1 block tracking-widest">冠軍頭銜自訂</label>
                    <input type="text" id="championTitleInput" value="CHAMPION" oninput="renderBracket()" class="w-full bg-black/50 border border-theme rounded p-2 text-white focus:outline-none focus:border-theme-strong transition-colors text-sm" placeholder="例如：大熊王">
                </div>

                <!-- 名單輸入 -->
                <div class="flex flex-col flex-grow mt-2">
                    <label class="text-xs text-theme font-bold mb-1 block tracking-widest">參賽者名單</label>
                    <textarea id="playerInput" class="w-full h-32 bg-black/50 border border-theme rounded-lg p-3 text-gray-200 resize-y focus:outline-none focus:border-theme-strong transition-colors text-sm leading-relaxed" placeholder="輸入名單（每行一位）">張三
李四
王五
趙六
孫七</textarea>
                </div>
            </div>
            
            <button onclick="startTournament()" class="mt-4 w-full bg-theme hover:brightness-110 text-white font-black tracking-widest py-3 rounded transition-all shadow-theme hover:shadow-theme-glow">開始產生賽程</button>
        </div>
    </aside>

    <main class="flex-grow relative overflow-auto" id="mainCanvas">
        <div id="bracket-content" class="min-w-max p-12 lg:p-24 flex items-center relative min-h-full">
            <svg id="lines-svg" class="absolute top-0 left-0 w-full h-full pointer-events-none z-0"></svg>
            <div id="rounds-container" class="flex gap-16 lg:gap-24 relative z-10 items-start mt-8">
                <div class="flex items-center justify-center w-full h-full text-neutral-600 text-xl font-bold tracking-widest h-64 mt-20">
                    請從左側輸入名單並產生賽程
                </div>
            </div>
        </div>
    </main>
    </div>

    <!-- Modal: 加入替補/魔王 -->
    <div id="customPrompt" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center backdrop-blur-sm transition-opacity">
        <div class="bg-neutral-900 border border-theme p-6 rounded-xl shadow-theme w-80 flex flex-col gap-4 transform transition-all">
            <h2 class="text-xl font-black text-theme tracking-wider">加入替補 / 魔王</h2>
            <p class="text-xs text-gray-400">在此空位加入新選手，將展開對決。<br><span class="text-purple-400">替補人員將以紫色標示。</span></p>
            <input type="text" id="promptInput" class="w-full bg-black border border-theme rounded p-3 text-white focus:outline-none focus:border-theme-strong transition-colors" placeholder="請輸入選手名稱">
            <div class="flex justify-end gap-3 mt-2">
                <button onclick="closePrompt()" class="px-4 py-2 text-sm text-gray-400 hover:text-white transition-colors">取消</button>
                <button onclick="confirmPrompt()" class="px-4 py-2 text-sm bg-theme hover:brightness-110 text-white rounded font-bold transition-colors">確認加入</button>
            </div>
        </div>
    </div>

    <!-- Modal: 自訂警告框 -->
    <div id="alertModal" class="fixed inset-0 bg-black/80 z-[60] hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-neutral-900 border border-theme p-8 rounded-xl shadow-theme min-w-[300px] text-center transform transition-all">
            <div class="text-4xl mb-4">⚠️</div>
            <p id="alertMsg" class="text-lg text-white font-bold mb-6 tracking-wide"></p>
            <button onclick="closeAlert()" class="px-8 py-2 bg-theme hover:brightness-110 text-white rounded font-bold transition-colors w-full tracking-widest">確認</button>
        </div>
    </div>

    <script>
        const SETTINGS_KEY = 'j5x-tournament-settings-v1';
        let playersData = [];
        let manualWinners = {}; 
        let tournamentMatrix = []; 
        let injectedPlayers = {}; 
        let promptTarget = null;
        let customRoundNames = {}; // 儲存使用者自訂的賽事輪次名稱

        function saveSettings() {
            J5XStorage.set(SETTINGS_KEY, {
                themeColor: document.getElementById('themeColorPicker').value,
                bgColor: document.getElementById('bgColorPicker').value,
                screenshot: document.getElementById('screenshotToggle').checked,
                mode: document.getElementById('modeSelect').value,
                ffa: document.getElementById('ffaSelect').value,
                championTitle: document.getElementById('championTitleInput').value,
                playerInput: document.getElementById('playerInput').value
            });
        }

        function restoreSettings() {
            const saved = J5XStorage.get(SETTINGS_KEY, {});
            const color = /^#[0-9a-f]{6}$/i;
            if (color.test(saved.themeColor || '')) document.getElementById('themeColorPicker').value = saved.themeColor;
            if (color.test(saved.bgColor || '')) document.getElementById('bgColorPicker').value = saved.bgColor;
            if (saved.mode === 'random' || saved.mode === 'manual') document.getElementById('modeSelect').value = saved.mode;
            if (saved.ffa === 'true' || saved.ffa === 'false') document.getElementById('ffaSelect').value = saved.ffa;
            if (typeof saved.championTitle === 'string') document.getElementById('championTitleInput').value = saved.championTitle;
            if (typeof saved.playerInput === 'string' && saved.playerInput.trim()) document.getElementById('playerInput').value = saved.playerInput;
            document.getElementById('screenshotToggle').checked = saved.screenshot === true;
            updateThemeColors();
            toggleScreenshotMode();
        }

        // 工具函數：Hex 轉 RGB，給 CSS 變數使用
        function hexToRgbStr(hex) {
            hex = hex.replace(/^#/, '');
            if (hex.length === 3) hex = hex.split('').map(char => char + char).join('');
            let r = parseInt(hex.substring(0, 2), 16);
            let g = parseInt(hex.substring(2, 4), 16);
            let b = parseInt(hex.substring(4, 6), 16);
            return `${r}, ${g}, ${b}`;
        }

        // 更新主題顏色
        function updateThemeColors() {
            const themeColor = document.getElementById('themeColorPicker').value;
            const bgColor = document.getElementById('bgColorPicker').value;
            const rgbStr = hexToRgbStr(themeColor);
            
            document.documentElement.style.setProperty('--theme-color', themeColor);
            document.documentElement.style.setProperty('--theme-rgb', rgbStr);
            document.documentElement.style.setProperty('--canvas-bg', bgColor);
            
            // 重新畫線套用新顏色
            if (tournamentMatrix.length > 0) drawLines();
            saveSettings();
        }

        // 截圖模式切換
        function toggleScreenshotMode() {
            const isChecked = document.getElementById('screenshotToggle').checked;
            if (isChecked) {
                document.body.classList.add('screenshot-mode');
            } else {
                document.body.classList.remove('screenshot-mode');
            }
            saveSettings();
        }

        function showAlert(msg) {
            document.getElementById('alertMsg').innerText = msg;
            document.getElementById('alertModal').classList.remove('hidden');
            document.getElementById('alertModal').classList.add('flex');
        }
        function closeAlert() {
            document.getElementById('alertModal').classList.add('hidden');
            document.getElementById('alertModal').classList.remove('flex');
        }

        function handleModeChange() {
            const mode = document.getElementById('modeSelect').value;
            const ta = document.getElementById('playerInput');
            if (mode === 'random') {
                ta.value = "張三\n李四\n王五\n趙六\n孫七";
                ta.placeholder = "輸入名單（每行一位）";
            } else {
                ta.value = "張三 vs 李四\n王五 vs 趙六\n大魔王";
                ta.placeholder = "輸入名單（格式：選手A vs 選手B）\n若單人請直接輸入名字";
            }
            saveSettings();
        }

        // 儲存使用者修改的賽程名稱
        function updateRoundName(r, name) {
            customRoundNames[r] = name;
            saveSettings();
        }

        function startTournament() {
            const mode = document.getElementById('modeSelect').value;
            const input = document.getElementById('playerInput').value;
            const lines = input.split('\n').map(n => n.trim()).filter(n => n !== '');
            
            if (lines.length === 0) return showAlert("請輸入參賽者名單！");

            playersData = [];
            manualWinners = {}; 
            injectedPlayers = {}; 
            customRoundNames = {}; // 開始新賽事時重置自訂名稱

            if (mode === 'random') {
                if (lines.length < 2) return showAlert("隨機抽籤至少需 2 名參賽者！");
                let shuffled = [...lines].map((name, i) => ({ id: `p_${i}_${Date.now()}`, name: name }));
                shuffled.sort(() => Math.random() - 0.5);
                playersData = shuffled;
            } else {
                lines.forEach((line, idx) => {
                    let parts = line.split(/vs/i).map(p => p.trim());
                    let p1 = { id: `m1_${idx}_${Date.now()}`, name: parts[0] };
                    let p2 = parts[1] ? { id: `m2_${idx}_${Date.now()}`, name: parts[1] } : null;
                    playersData.push([p1, p2]);
                });
            }

            initTournamentState();
        }

        function initTournamentState() {
            const mode = document.getElementById('modeSelect').value;
            const ffaMode = document.getElementById('ffaSelect').value === 'true';
            tournamentMatrix = [];
            let round0 = [];

            if (ffaMode && mode === 'random' && playersData.length >= 3 && playersData.length <= 4) {
                round0.push({ isFFA: true, basePlayers: playersData.map(p => p), prevIndices: [] });
            } else {
                if (mode === 'random') {
                    for (let i = 0; i < playersData.length; i += 2) {
                        if (i + 1 < playersData.length) {
                            round0.push({ baseP1: playersData[i], baseP2: playersData[i+1] });
                        } else {
                            round0.push({ baseP1: playersData[i], baseP2: null }); 
                        }
                    }
                } else {
                    playersData.forEach(pair => {
                        round0.push({ baseP1: pair[0], baseP2: pair[1] });
                    });
                }
            }

            tournamentMatrix.push(round0);
            updateTournamentState();
        }

        function updateTournamentState() {
            let newMatrix = [ tournamentMatrix[0] ];
            let currentR = 0;
            const ffaMode = document.getElementById('ffaSelect').value === 'true';

            while (true) {
                let prevR = newMatrix[currentR];
                if (prevR.length <= 1) break; 

                let nextR = [];
                
                if (ffaMode && prevR.length >= 3 && prevR.length <= 4 && !prevR[0].isFFA) {
                    nextR.push({ isFFA: true, prevIndices: prevR.map((_, idx) => idx) });
                    newMatrix.push(nextR);
                    break; 
                } else {
                    for (let i = 0; i < prevR.length; i += 2) {
                        nextR.push({ prev1Index: i, prev2Index: (i + 1 < prevR.length) ? (i + 1) : null });
                    }
                    newMatrix.push(nextR);
                    currentR++;
                }
            }
            tournamentMatrix = newMatrix;

            for (let r = 0; r < tournamentMatrix.length; r++) {
                for (let m = 0; m < tournamentMatrix[r].length; m++) {
                    let match = tournamentMatrix[r][m];
                    let matchKey = `${r}-${m}`;
                    
                    if (match.isFFA) {
                        match.ffaPlayers = [];
                        if (match.basePlayers) {
                            match.ffaPlayers = match.basePlayers;
                        } else {
                            match.prevIndices.forEach(prevIdx => {
                                let prevM = tournamentMatrix[r-1][prevIdx];
                                match.ffaPlayers.push(prevM ? prevM.winner : null);
                            });
                        }
                    } else {
                        let injected = injectedPlayers[matchKey];
                        let p1 = null, p2 = null, isSingle = false;

                        if (r === 0) {
                            p1 = match.baseP1;
                            p2 = injected ? injected : match.baseP2;
                            isSingle = !match.baseP2 && !injected;
                        } else {
                            let prevM1 = tournamentMatrix[r-1][match.prev1Index];
                            let prevM2 = match.prev2Index !== null ? tournamentMatrix[r-1][match.prev2Index] : null;

                            p1 = prevM1 ? prevM1.winner : null;
                            p2 = injected ? injected : (prevM2 ? prevM2.winner : null);
                            isSingle = !prevM2 && !injected;
                        }

                        match.p1 = p1;
                        match.p2 = p2;
                        match.isStructuralSingle = isSingle;
                        match.winner = null;

                        if (isSingle) {
                            if (p1) match.winner = p1; 
                        } else {
                            let manualWinId = manualWinners[matchKey];
                            if (manualWinId) {
                                if (p1 && p1.id === manualWinId) match.winner = p1;
                                if (p2 && p2.id === manualWinId) match.winner = p2;
                            }
                        }
                    }
                }
            }
            renderBracket();
        }

        function selectWinner(r, m, winnerId) {
            let matchKey = `${r}-${m}`;
            let currentWinner = manualWinners[matchKey];
            if (currentWinner !== winnerId) {
                if (currentWinner) clearDownstreamManualWinners(r, m, currentWinner); 
                manualWinners[matchKey] = winnerId;
                updateTournamentState();
            }
        }

        function setFFARank(r, m, playerId, rank) {
            let matchKey = `${r}-${m}`;
            if (!manualWinners[matchKey]) manualWinners[matchKey] = {};
            let placements = manualWinners[matchKey];

            if (rank === "") {
                delete placements[playerId];
            } else {
                for (let pid in placements) {
                    if (placements[pid] == rank) delete placements[pid];
                }
                placements[playerId] = parseInt(rank);
            }
            updateTournamentState();
        }

        function clearDownstreamManualWinners(startR, startM, oldWinnerId) {
            for (let r = startR + 1; r < tournamentMatrix.length; r++) {
                for (let m = 0; m < tournamentMatrix[r].length; m++) {
                    let matchKey = `${r}-${m}`;
                    let match = tournamentMatrix[r][m];
                    if (match.isFFA) {
                        delete manualWinners[matchKey]; 
                    } else if (manualWinners[matchKey] === oldWinnerId) {
                        delete manualWinners[matchKey];
                    }
                }
            }
        }

        function promptInjectPlayer(r, m) {
            promptTarget = { r, m };
            const input = document.getElementById('promptInput');
            input.value = '';
            document.getElementById('customPrompt').classList.remove('hidden');
            document.getElementById('customPrompt').classList.add('flex');
            setTimeout(() => input.focus(), 100);
        }

        function closePrompt() {
            document.getElementById('customPrompt').classList.add('hidden');
            document.getElementById('customPrompt').classList.remove('flex');
            promptTarget = null;
        }

        function confirmPrompt() {
            const name = document.getElementById('promptInput').value.trim();
            if (name && promptTarget) {
                const { r, m } = promptTarget;
                injectedPlayers[`${r}-${m}`] = { id: `inj_${r}_${m}_${Date.now()}`, name: name, isInjected: true };
                delete manualWinners[`${r}-${m}`]; 
                closePrompt();
                updateTournamentState();
            }
        }

        document.getElementById('promptInput').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') confirmPrompt();
        });

        function removeInjected(r, m) {
            delete injectedPlayers[`${r}-${m}`];
            let matchKey = `${r}-${m}`;
            if (manualWinners[matchKey]) {
                let oldWinnerId = manualWinners[matchKey];
                delete manualWinners[matchKey];
                clearDownstreamManualWinners(r, m, oldWinnerId);
            }
            updateTournamentState();
        }

        function renderBracket() {
            const container = document.getElementById('rounds-container');
            const customChampTitle = document.getElementById('championTitleInput').value.trim() || 'CHAMPION';
            container.innerHTML = '';

            tournamentMatrix.forEach((round, r) => {
                // 整個輪次的容器
                const roundCol = document.createElement('div');
                roundCol.className = 'flex flex-col gap-4 z-10 w-52 shrink-0';

                // 加入可編輯的輪次標題
                let isFinalRound = r === tournamentMatrix.length - 1;
                let defaultRoundName = isFinalRound ? (round[0].isFFA ? '決賽大亂鬥' : '最終決賽') : `第 ${r + 1} 輪`;
                if (customRoundNames[r] === undefined) customRoundNames[r] = defaultRoundName;
                
                const titleInput = document.createElement('input');
                titleInput.type = 'text';
                titleInput.value = customRoundNames[r];
                titleInput.className = 'text-center bg-transparent border-b border-transparent hover:border-gray-700 focus:border-theme text-gray-300 font-bold mb-2 focus:outline-none transition-colors w-full tracking-widest pb-1';
                titleInput.onchange = (e) => updateRoundName(r, e.target.value);
                roundCol.appendChild(titleInput);

                // 賽事列表容器
                const matchesContainer = document.createElement('div');
                matchesContainer.className = 'flex flex-col justify-around gap-8 flex-grow';

                round.forEach((m, i) => {
                    const div = document.createElement('div');
                    div.id = `m-${r}-${i}`;
                    
                    if (m.isFFA) {
                        div.className = 'bg-neutral-900 border-2 border-yellow-600 rounded-lg w-full flex flex-col shadow-[0_0_30px_rgba(202,138,4,0.3)] overflow-hidden shrink-0 z-10 relative';
                        let ffaHtml = `<div class="bg-gradient-to-r from-yellow-900 via-yellow-700 to-yellow-900 text-white text-sm font-black py-3 tracking-widest text-center shadow-md">⚔️ 決賽大混戰 ⚔️</div>`;
                        
                        let placements = manualWinners[`${r}-${i}`] || {};
                        let expectedPlayers = m.basePlayers ? m.basePlayers.length : m.prevIndices.length;
                        
                        for(let pIdx = 0; pIdx < expectedPlayers; pIdx++) {
                            let p = m.ffaPlayers[pIdx];
                            if (p) {
                                let currentRank = placements[p.id] || "";
                                let pNameDisplay = p.isInjected ? `<span class="injected-player">${p.name}</span>` : p.name;
                                ffaHtml += `
                                <div class="flex items-center justify-between p-3 border-b border-yellow-900/40 hover:bg-yellow-900/30 transition-colors">
                                    <span class="text-gray-100 font-bold ${currentRank ? 'text-yellow-400 drop-shadow-md' : ''}">${pNameDisplay}</span>
                                    <select onchange="setFFARank(${r}, ${i}, '${p.id}', this.value)" class="bg-black text-xs p-1.5 rounded border ${currentRank ? 'border-yellow-500 text-yellow-400' : 'border-gray-700 text-gray-400'} focus:outline-none focus:border-white transition-colors cursor-pointer">
                                        <option value="">-- 排位 --</option>
                                        <option value="1" ${currentRank == 1 ? 'selected' : ''}>🥇 冠軍</option>
                                        <option value="2" ${currentRank == 2 ? 'selected' : ''}>🥈 亞軍</option>
                                        <option value="3" ${currentRank == 3 ? 'selected' : ''}>🥉 季軍</option>
                                    </select>
                                </div>`;
                            } else {
                                ffaHtml += `<div class="p-4 border-b border-yellow-900/40 text-neutral-600 text-xs tracking-widest text-center">等待強者晉級...</div>`;
                            }
                        }
                        div.innerHTML = ffaHtml;

                    } else {
                        div.className = 'bg-neutral-900 border border-theme rounded-lg w-full text-center flex flex-col shadow-[0_0_15px_rgba(0,0,0,0.8)] overflow-hidden shrink-0 transition-transform relative';
                        let hasP1 = !!m.p1, hasP2 = !!m.p2, isSingle = m.isStructuralSingle, isInjected = !!injectedPlayers[`${r}-${i}`];

                        let p1Class = `p-3 flex-1 flex items-center justify-center relative ${hasP1 && !isSingle && hasP2 ? 'cursor-pointer hover-bg-theme-light transition-colors' : ''}`;
                        if (m.winner?.id === m.p1?.id && m.p1) p1Class += ' bg-theme font-bold text-white shadow-inner-theme';
                        else p1Class += ' text-gray-200';
                        
                        let p1NameDisplay = m.p1?.isInjected ? `<span class="injected-player">${m.p1.name}</span>` : (m.p1?.name || '');
                        let p1Content = m.p1 ? p1NameDisplay : '<span class="text-xs text-neutral-600 tracking-widest">等待對手...</span>';
                        if (m.p1) {
                            if (m.winner && m.winner.id !== m.p1.id && hasP2) p1Content = `<span class="line-through text-neutral-500">${m.p1.name}</span>`;
                            else if (m.winner && m.winner.id === m.p1.id && hasP2) p1Content = `<span class="text-yellow-400 mr-2 drop-shadow-md">▲</span> ${p1NameDisplay}`;
                        }
                        let p1Click = (hasP1 && hasP2 && !isSingle) ? `onclick="selectWinner(${r},${i},'${m.p1.id}')"` : '';

                        let p2Class = `p-3 flex-1 flex items-center justify-center border-t border-theme relative ${hasP2 && !isSingle && hasP1 ? 'cursor-pointer hover-bg-theme-light transition-colors' : ''}`;
                        if (m.winner?.id === m.p2?.id && m.p2) p2Class += ' bg-theme font-bold text-white shadow-inner-theme';
                        else p2Class += ' text-gray-200';
                        
                        let p2Content = '', p2Click = '';

                        if (isSingle) {
                            p2Content = `<div class="group relative w-full h-full flex items-center justify-center py-1">
                                            <span class="text-xs text-theme font-bold tracking-widest group-hover:opacity-0 transition-opacity">無對手，自動晉級</span>
                                            <button onclick="promptInjectPlayer(${r}, ${i})" class="absolute inset-0 m-auto bg-theme hover:brightness-110 text-white text-xs font-bold rounded opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center w-[85%] h-[80%] shadow-theme">➕ 替補/魔王</button>
                                         </div>`;
                            p2Class = `flex-1 flex items-center justify-center border-t border-theme bg-black/40`;
                        } else {
                            // 替補移除按鈕加上 remove-btn 類別，供截圖模式控制
                            let btnStr = isInjected ? `<button onclick="event.stopPropagation(); removeInjected(${r}, ${i})" class="remove-btn absolute right-1 top-1 bg-neutral-800 border border-theme text-white text-[10px] px-1.5 py-0.5 rounded shadow z-10 transition-colors hover:bg-theme">移除</button>` : '';
                            
                            let p2NameDisplay = m.p2?.isInjected ? `<span class="injected-player">${m.p2.name}</span>` : (m.p2?.name || '');
                            p2Content = m.p2 ? p2NameDisplay : '<span class="text-xs text-neutral-600 tracking-widest">等待對手...</span>';
                            
                            if (m.p2) {
                                if (m.winner && m.winner.id !== m.p2.id && hasP1) p2Content = `<span class="line-through text-neutral-500">${m.p2.name}</span>` + btnStr;
                                else if (m.winner && m.winner.id === m.p2.id && hasP1) p2Content = `<span class="text-yellow-400 mr-2 drop-shadow-md">▲</span> ${p2NameDisplay}` + btnStr;
                                else p2Content = p2NameDisplay + btnStr;
                            } else {
                                p2Content += btnStr;
                            }
                            p2Click = (hasP2 && hasP1 && !isSingle) ? `onclick="selectWinner(${r},${i},'${m.p2.id}')"` : '';
                        }
                        div.innerHTML = `<div class="${p1Class}" ${p1Click}>${p1Content}</div><div class="${p2Class}" ${p2Click}>${p2Content}</div>`;
                    }
                    matchesContainer.appendChild(div);
                });
                roundCol.appendChild(matchesContainer);
                container.appendChild(roundCol);
            });

            // 檢查是否選出最終冠軍
            let lastRound = tournamentMatrix[tournamentMatrix.length - 1];
            let champ = null, runnerUp = null, thirdPlace = null;

            if (lastRound && lastRound.length === 1) {
                if (lastRound[0].isFFA) {
                    let placements = manualWinners[`${tournamentMatrix.length - 1}-0`] || {};
                    let ffaPlayers = lastRound[0].ffaPlayers || lastRound[0].basePlayers;
                    for (let pid in placements) {
                        let p = ffaPlayers.find(x => x && x.id === pid);
                        if (placements[pid] === 1) champ = p;
                        if (placements[pid] === 2) runnerUp = p;
                        if (placements[pid] === 3) thirdPlace = p;
                    }
                } else if (lastRound[0].winner) {
                    champ = lastRound[0].winner;
                }
            }

            if (champ) {
                const col = document.createElement('div');
                col.className = 'flex flex-col gap-6 ml-12 z-20 items-center justify-center pt-8';
                col.id = 'champion-column';
                
                let champNameDisplay = champ.isInjected ? `<span class="injected-player text-white text-shadow-none">${champ.name}</span>` : champ.name;

                let html = `
                    <div id="champion-card" class="relative bg-gradient-to-br from-yellow-700 via-yellow-600 to-yellow-900 border border-yellow-400 p-8 rounded-xl shadow-[0_0_40px_rgba(250,204,21,0.5)] text-center w-64 transform scale-110 z-30 transition-transform hover:scale-125">
                        <div class="absolute -top-8 left-1/2 -translate-x-1/2 text-6xl drop-shadow-[0_0_15px_rgba(250,204,21,0.8)]">👑</div>
                        <div class="text-xs text-yellow-200 tracking-widest mb-2 font-black">${customChampTitle}</div>
                        <div class="text-3xl font-black text-white drop-shadow-lg">${champNameDisplay}</div>
                    </div>
                `;

                if (runnerUp) {
                    let runnerNameDisplay = runnerUp.isInjected ? `<span class="injected-player">${runnerUp.name}</span>` : runnerUp.name;
                    html += `
                    <div class="bg-gradient-to-br from-gray-500 to-gray-800 border border-gray-400 p-4 rounded-lg shadow-[0_0_20px_rgba(156,163,175,0.3)] text-center w-52 z-20 mt-4">
                        <div class="text-[10px] text-gray-300 tracking-widest mb-1 font-bold">2ND PLACE</div>
                        <div class="text-xl font-black text-white drop-shadow">${runnerNameDisplay}</div>
                    </div>`;
                }

                if (thirdPlace) {
                    let thirdNameDisplay = thirdPlace.isInjected ? `<span class="injected-player">${thirdPlace.name}</span>` : thirdPlace.name;
                    html += `
                    <div class="bg-gradient-to-br from-orange-700 to-amber-900 border border-orange-500 p-3 rounded-lg shadow-[0_0_20px_rgba(217,119,6,0.3)] text-center w-48 z-10">
                        <div class="text-[10px] text-orange-300 tracking-widest mb-1 font-bold">3RD PLACE</div>
                        <div class="text-lg font-black text-white drop-shadow">${thirdNameDisplay}</div>
                    </div>`;
                }

                col.innerHTML = html;
                container.appendChild(col);
            }

            setTimeout(drawLines, 50);
        }

        function drawLines() {
            const svg = document.getElementById('lines-svg');
            const container = document.getElementById('bracket-content');
            if (!svg || !container) return;

            svg.innerHTML = '';
            const containerRect = container.getBoundingClientRect();
            // 取得目前的自訂主題色來畫線
            const themeColor = document.documentElement.style.getPropertyValue('--theme-color') || '#ec4899';

            for (let r = 1; r < tournamentMatrix.length; r++) {
                for (let m = 0; m < tournamentMatrix[r].length; m++) {
                    let match = tournamentMatrix[r][m];
                    let currentMatchDiv = document.getElementById(`m-${r}-${m}`);
                    if (!currentMatchDiv) continue;

                    let targetRect = currentMatchDiv.getBoundingClientRect();
                    let targetX = targetRect.left - containerRect.left;
                    let targetY = targetRect.top - containerRect.top + (targetRect.height / 2);

                    if (match.isFFA) {
                        match.prevIndices.forEach(prevIdx => {
                            let prevDiv = document.getElementById(`m-${r-1}-${prevIdx}`);
                            if (prevDiv) {
                                let srcRect = prevDiv.getBoundingClientRect();
                                let srcX = srcRect.right - containerRect.left;
                                let srcY = srcRect.top - containerRect.top + (srcRect.height / 2);
                                createBezierPath(svg, srcX, srcY, targetX, targetY, '#eab308', 2); // 混戰線保持金色
                            }
                        });
                    } else {
                        if (match.prev1Index !== null) {
                            let prev1Div = document.getElementById(`m-${r-1}-${match.prev1Index}`);
                            if (prev1Div) {
                                let srcRect = prev1Div.getBoundingClientRect();
                                let srcX = srcRect.right - containerRect.left;
                                let srcY = srcRect.top - containerRect.top + (srcRect.height / 2);
                                createBezierPath(svg, srcX, srcY, targetX, targetY, themeColor);
                            }
                        }
                        if (match.prev2Index !== null) {
                            let prev2Div = document.getElementById(`m-${r-1}-${match.prev2Index}`);
                            if (prev2Div) {
                                let srcRect = prev2Div.getBoundingClientRect();
                                let srcX = srcRect.right - containerRect.left;
                                let srcY = srcRect.top - containerRect.top + (srcRect.height / 2);
                                createBezierPath(svg, srcX, srcY, targetX, targetY, themeColor);
                            }
                        }
                    }
                }
            }

            let lastRound = tournamentMatrix[tournamentMatrix.length - 1];
            let champDiv = document.getElementById('champion-card');
            
            let hasChamp = false;
            if (lastRound && lastRound.length === 1) {
                if (lastRound[0].isFFA) {
                    let p = manualWinners[`${tournamentMatrix.length - 1}-0`] || {};
                    hasChamp = Object.values(p).includes(1);
                } else if (lastRound[0].winner) {
                    hasChamp = true;
                }
            }

            if (hasChamp && champDiv) {
                let finalMatchDiv = document.getElementById(`m-${tournamentMatrix.length - 1}-0`);
                if (finalMatchDiv) {
                    let srcRect = finalMatchDiv.getBoundingClientRect();
                    let targetRect = champDiv.getBoundingClientRect();

                    let srcX = srcRect.right - containerRect.left;
                    let srcY = srcRect.top - containerRect.top + (srcRect.height / 2);
                    let targetX = targetRect.left - containerRect.left;
                    let targetY = targetRect.top - containerRect.top + (targetRect.height / 2);

                    createBezierPath(svg, srcX, srcY, targetX, targetY, '#eab308', 3); // 冠軍線保持金色
                }
            }
        }

        function createBezierPath(svg, x1, y1, x2, y2, color, width = 2) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            let cx = (x1 + x2) / 2;
            path.setAttribute('d', `M ${x1} ${y1} C ${cx} ${y1}, ${cx} ${y2}, ${x2} ${y2}`);
            path.setAttribute('fill', 'transparent');
            path.setAttribute('stroke', color);
            path.setAttribute('stroke-width', width);
            path.setAttribute('class', 'svg-line');
            svg.appendChild(path);
        }

        window.addEventListener('resize', () => {
            if (tournamentMatrix.length > 0) requestAnimationFrame(drawLines);
        });

        document.getElementById('championTitleInput').addEventListener('input', saveSettings);
        document.getElementById('playerInput').addEventListener('input', saveSettings);
        window.addEventListener('j5x-storage-consent', event => {
            if (event.detail?.granted) restoreSettings();
        });

        // 頁面載入時初始化主題與已同意儲存的偏好
        restoreSettings();

    </script>
</body>
</html>
