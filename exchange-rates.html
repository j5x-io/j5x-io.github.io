    async function loadHistory(){const request=++chartRequest,config=HISTORY_RANGES[chartRange],range=t(`range${chartRange[0].toUpperCase()}${chartRange.slice(1)}`);$("historyTitle").textContent=t("historyTitle",{base:chartBase,quote:chartQuote});$("historyLatest").textContent="—";$("historyDates").textContent=t("historyLoading");$("chartState").hidden=false;$("chartState").textContent=t("chartLoading");$("historyChart").setAttribute("aria-label",t("historyAria",{base:chartBase,quote:chartQuote,range}));try{const response=await fetch(`${API}?${historyQuery()}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const rows=await response.json();if(request!==chartRequest)return;if(!Array.isArray(rows)||rows.length<2)throw new Error("Insufficient historical data");chartRows=rows.filter(row=>Number.isFinite(row.rate)).sort((a,b)=>a.date.localeCompare(b.date));const latest=chartRows.at(-1);$("historyLatest").textContent=`1 ${chartBase} = ${format(latest.rate,chartQuote)} ${chartQuote}`;$("historyDates").textContent=`${chartRows[0].date}－${latest.date}`;$("chartState").hidden=true;hoverIndex=-1;drawChart()}catch(error){if(request!==chartRequest)return;chartRows=[];$("chartState").hidden=false;$("chartState").textContent=t("historyError");$("historyDates").textContent=t("historyFailed");drawChart();console.error(error)}}
    function setStatus(state,key){statusKey=key;$("status").dataset.state=state;$("statusText").textContent=t(key);$("refresh").disabled=state==="loading";$("refresh").classList.toggle("loading",state==="loading")}
    function applyRows(rows,cached=false){rates={TWD:1};rows.forEach(row=>rates[row.quote]=row.rate);rateDate=rows.reduce((latest,row)=>row.date>latest?row.date:latest,"");$("updatedAt").textContent=t("updated",{date:rateDate||"—"});setStatus(cached?"error":"success",cached?"cachedStatus":"updatedStatus");render()}
    async function loadRates(){setStatus("loading","loadingRates");errorKey="";$("error").classList.remove("show");try{const quotes=ALL.filter(code=>code!=="TWD").join(","),response=await fetch(`${API}?base=TWD&quotes=${quotes}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const rows=await response.json();if(!Array.isArray(rows)||!rows.length)throw new Error("Empty data");J5XStorage.set(CACHE_KEY,{rows,savedAt:Date.now()});applyRows(rows)}catch(error){const cached=J5XStorage.get(CACHE_KEY,null);if(cached?.rows?.length){applyRows(cached.rows,true);errorKey="cachedError"}else{setStatus("error","loadFailed");errorKey="networkError"}$("errorText").textContent=t(errorKey);$("error").classList.add("show");console.error(error)}finally{$("refresh").disabled=false;$("refresh").classList.remove("loading");lucide.createIcons()}}
    function applyLanguage(next,persist=true){lang=next==="en"?"en":"zh";document.documentElement.lang=lang==="en"?"en":"zh-TW";if(persist){J5XStorage.set(LANG_KEY,lang);saveSettings()}document.title=t("pageTitle");document.querySelector('meta[name="description"]').content=lang==="en"?"Live exchange-rate converter with multiple currencies and historical charts.":"今日匯率換算工具，可同時顯示多個幣種並即時換算。";$("brandText").textContent=t("brand");$("backText").textContent=t("back");$("languageText").textContent=t("switchLabel");$("language").setAttribute("aria-label",t("switchLanguage"));$("pageHeading").innerHTML=t("heading");$("introText").textContent=t("intro");$("statusText").textContent=t(statusKey);$("updatedAt").textContent=t("updated",{date:rateDate||"—"});$("refreshText").textContent=t("refresh");$("sourceText").textContent=t("source");$("ranges").setAttribute("aria-label",lang==="en"?"Historical exchange-rate range":"歷史匯率時間範圍");$("primaryTitle").textContent=t("primary");$("primaryHelp").textContent=t("primaryHelp");$("availableTitle").textContent=t("available");$("availableHelp").textContent=t("availableHelp");$("footnote").textContent=t("footnote");if(errorKey)$("errorText").textContent=t(errorKey);const rangeKeys={"7d":"range7d","1m":"range1m","1y":"range1y","5y":"range5y",max:"rangeMax"};document.querySelectorAll("[data-range]").forEach(button=>button.textContent=t(rangeKeys[button.dataset.range]));render();loadHistory();lucide.createIcons()}
    document.querySelectorAll("[data-range]").forEach(button=>button.addEventListener("click",()=>{chartRange=button.dataset.range;saveSettings();document.querySelectorAll("[data-range]").forEach(item=>item.classList.toggle("selected",item===button));loadHistory()}));
    $("historyChart").addEventListener("pointermove",event=>{if(!chartRows.length)return;const rect=event.currentTarget.getBoundingClientRect(),plotLeft=54,plotRight=18,index=Math.max(0,Math.min(chartRows.length-1,Math.round((event.clientX-rect.left-plotLeft)/(rect.width-plotLeft-plotRight)*(chartRows.length-1))));hoverIndex=index;const row=chartRows[index],tooltip=$("chartTooltip");tooltip.innerHTML=`<b>1 ${chartBase} = ${format(row.rate,chartQuote)} ${chartQuote}</b><span>${row.date}</span>`;tooltip.hidden=false;tooltip.style.left=`${Math.min(rect.width-170,Math.max(8,event.clientX-rect.left+12))}px`;tooltip.style.top=`${Math.max(8,event.clientY-rect.top-58)}px`;drawChart()});$("historyChart").addEventListener("pointerleave",()=>{hoverIndex=-1;$("chartTooltip").hidden=true;drawChart()});new ResizeObserver(drawChart).observe($("historyChart"));
    $("refresh").addEventListener("click",()=>{loadRates();loadHistory()});$("language").addEventListener("click",()=>{applyLanguage(lang==="zh"?"en":"zh");window.dispatchEvent(new CustomEvent("j5x-language-change"))});
    restoreSettings();
    window.addEventListener("j5x-storage-consent",event=>{if(event.detail?.granted){restoreSettings();applyLanguage(lang,false);loadRates()}});
    applyLanguage(lang,false);loadRates();
  </script>
